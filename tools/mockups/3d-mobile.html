<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>WK 3D – mobil</title><link rel="stylesheet" href="mockup.css" />
<style>
  .view { position:relative; height:250px; margin:0 20px 12px; border-radius:16px; background: radial-gradient(70% 60% at 50% 55%, #fff, #e9eeea); box-shadow: var(--shadow); }
  .view svg { position:absolute; left:50%; top:50%; width:250px; height:210px; transform:translate(-50%,-48%); }
  .view .seg { position:absolute; left:12px; top:12px; display:flex; gap:4px; }
  .view .seg span { padding:5px 11px; border-radius:8px; background:#fff; border:1px solid var(--line-2); font-size:12px; font-weight:600; color:var(--ink-2); }
  .view .seg span.on { background:var(--head); color:#fff; border-color:var(--head); }
  .f { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .f:last-child { border-bottom:0; } .f span { color:var(--ink-3); font-size:13px; }
</style></head>
<body class="mobile" data-app="3d">
  <div class="status-bar"><span>9:41</span><span class="sig"><i></i><i></i></span></div>
  <div class="m-head"><span class="back">‹</span><div style="flex:1"><h1>Antriebsflansch</h1><small>ET-100744 · über QR-Code</small></div><span class="demo">Beispieldaten</span></div>
  <div class="view"><div class="seg"><span>Scan</span><span class="on">CAD</span></div><svg data-part="flansch" data-sw="0.8" data-vb="-60 -50 120 82"></svg></div>
  <div class="m-body">
    <div class="m-card" style="padding:4px 16px">
      <div class="f"><span>Version</span><b>V3 · <span class="chip ok">Freigegeben</span></b></div>
      <div class="f"><span>Lagerplatz</span><b>H2-B-05-02</b></div>
      <div class="f"><span>Verwendung</span><b>FB-03, FB-05</b></div>
      <div class="f"><span>Dateien</span><b>Scan · CAD · Zeichnung</b></div>
    </div>
    <div class="m-btn" style="margin-top:14px">Zeichnung öffnen</div>
  </div>
  <nav class="tabbar"><span class="on"><i></i>Suche</span><span><i></i>Scan</span><span><i></i>Merkliste</span><span><i></i>Dateien</span></nav>
  <script src="parts.js"></script>
  <script src="shell.js"></script>
</body></html>
