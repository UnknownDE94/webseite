<!doctype html>
<meta charset="utf-8" />
<title>Imagefilm – Szenen</title>
<style>
  @font-face { font-family: "Inter"; src: url("../../assets/fonts/inter-wght.woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; }
  svg { display: block; }
  text { font-family: "Inter", sans-serif; }
</style>
<svg id="s" width="1280" height="720" viewBox="0 0 1280 720"></svg>
<script>
/* ---------------------------------------------------------------------------
   Szenen für den Imagefilm (flacher Vektorstil, 1280 × 720).
   Block "n1": Stahlguss + Pharma + Werkstatt    Block "n2": Handschlag + Analyse
   Jede Szene ist eine reine Funktion der Zeit: window.setFrame(block, t).

   Personen: Arme sind Gelenkketten (Schulter → Ellenbogen → Hand) mit festen
   Segmentlängen. Ein Ellenbogen kann nur nach vorn beugen (wie beim Menschen);
   Posen werden über Winkel überblendet, nicht über Handpositionen.
--------------------------------------------------------------------------- */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("s");
const el = (tag, a = {}, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, k) => a + (b - a) * k;
const rad = (d) => (d * Math.PI) / 180;
function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const LIME = "#d4ec5f", GREEN = "#2c7f57", DGREEN = "#0e3d27", FILMGREEN = "#0a3a26";

/* ----- Arm-Kinematik ------------------------------------------------------- */
const L1 = 88, L2 = 82;                     // Oberarm, Unterarm
// Winkel a: Oberarm gegen „senkrecht nach unten“, positiv = nach vorn (Blickrichtung)
// Winkel b: Ellenbogenbeugung, positiv = Unterarm klappt nach vorn/oben
function armPoints(S, a, b) {
  const E = [S[0] + L1 * Math.sin(a), S[1] + L1 * Math.cos(a)];
  const g = a + b;
  return { E, H: [E[0] + L2 * Math.sin(g), E[1] + L2 * Math.cos(g)] };
}
function ikAngles(S, T) {
  let dx = T[0] - S[0], dy = T[1] - S[1];
  const d0 = Math.hypot(dx, dy) || 1;
  const d = clamp(d0, Math.abs(L1 - L2) + 8, L1 + L2 - 3);
  dx *= d / d0; dy *= d / d0;
  const phi = Math.atan2(dx, dy);
  const cosE = (L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2);
  const b = Math.PI - Math.acos(clamp(cosE, -1, 1));
  const cosD = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
  return { a: phi - Math.acos(clamp(cosD, -1, 1)), b };
}
const blendPose = (p, q, k) => ({ a: lerp(p.a, q.a, k), b: lerp(p.b, q.b, k) });
const REST = { a: rad(-3), b: rad(6) };

/* ----- Person ------------------------------------------------------------ */
function shade(hex, k) {              // Farbe abdunkeln (k<1) oder aufhellen (k>1)
  const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => clamp(Math.round(v * k), 0, 255));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
let uid = 0;
function Person(parent, o) {
  const id = "p" + uid++;
  const P = { o, x: 0, y: 0, sc: 1, dir: 1 };
  const defs = el("defs", {}, parent);
  const torsoD = "M-30 -352 Q0 -362 30 -352 L52 -343 Q57 -300 47 -244 Q44 -204 49 -176 Q0 -167 -49 -176 Q-44 -204 -47 -244 Q-57 -300 -52 -343 Z";
  const cp = el("clipPath", { id: id + "t" }, defs); el("path", { d: torsoD }, cp);
  P.g = el("g", {}, parent);
  el("ellipse", { cx: 8, cy: 4, rx: 74, ry: 10, fill: "#000", opacity: 0.16 }, P.g);            // Bodenschatten
  P.body = el("g", {}, P.g);
  const legD = "M-17 0 Q-18 62 -15 126 L-14 178 L14 178 L15 126 Q18 62 17 0 Z";
  P.legs = [-14, 14].map((hx, i) => {
    const l = el("g", { transform: `translate(${hx} -190)` }, P.body);
    const c = i === 0 ? shade(o.pants, 0.78) : o.pants;
    el("path", { d: legD, fill: c }, l);
    el("path", { d: "M-16 174 H14 L17 182 Q46 183 48 190 H-16 Z", fill: i === 0 ? shade(o.shoe, 0.8) : o.shoe }, l);
    return l;
  });
  P.armBack = el("g", {}, P.body);
  P.torso = el("g", {}, P.body);
  el("path", { d: torsoD, fill: o.coat }, P.torso);
  const tg = el("g", { "clip-path": `url(#${id}t)` }, P.torso);
  el("rect", { x: -60, y: -360, width: 34, height: 200, fill: "#000", opacity: 0.14 }, tg);        // Schattenseite
  el("rect", { x: 28, y: -360, width: 14, height: 200, fill: "#fff", opacity: 0.05 }, tg);         // Lichtkante
  if (o.stripes) { el("rect", { x: -60, y: -214, width: 120, height: 9, fill: LIME }, tg); el("rect", { x: -60, y: -192, width: 120, height: 9, fill: LIME }, tg); }
  el("path", { d: "M-14 -352 L0 -330 L14 -352", fill: "none", stroke: shade(o.coat, 0.7), "stroke-width": 3.5, "stroke-linejoin": "round" }, P.torso);
  el("line", { x1: 0, y1: -330, x2: 0, y2: -176, stroke: shade(o.coat, 0.75), "stroke-width": 2.2, opacity: 0.7 }, P.torso);
  if (o.badge) el("rect", { x: 18, y: -300, width: 12, height: 10, rx: 2, fill: LIME }, P.torso);
  el("path", { d: "M-9 -366 h18 v26 q-9 8 -18 0 z", fill: shade(o.skin, 0.9) }, P.body);
  P.head = el("g", { transform: "translate(0 -394)" }, P.body);
  el("circle", { cx: -19, cy: 3, r: 7, fill: shade(o.skin, 0.92) }, P.head);
  el("circle", { cx: 0, cy: 0, r: 35, fill: o.skin }, P.head);
  el("path", { d: "M-30 14 Q0 44 32 16 Q10 40 -30 14 Z", fill: "#000", opacity: 0.08 }, P.head);
  el("circle", { cx: 15, cy: 12, r: 6.5, fill: o.cheek || "#d68b69", opacity: 0.5 }, P.head);
  el("path", { d: "M33 0 q8 8 0 12", fill: "none", stroke: shade(o.skin, 0.8), "stroke-width": 3, "stroke-linecap": "round" }, P.head);
  el("ellipse", { cx: 19, cy: -3, rx: 3, ry: 3.8, fill: "#1b1f1d" }, P.head);
  el("circle", { cx: 20, cy: -4.4, r: 1, fill: "#fff", opacity: 0.8 }, P.head);
  el("path", { d: "M11 -13 Q19 -17 27 -13", fill: "none", stroke: o.brow || "#2a221d", "stroke-width": 3, "stroke-linecap": "round" }, P.head);
  el("path", { d: "M14 19 q8 6 17 -1", fill: "none", stroke: "#8a4a34", "stroke-width": 2.8, "stroke-linecap": "round" }, P.head);
  if (o.hat === "hard") {
    el("path", { d: "M-39 -5 A39 40 0 0 1 39 -5 Z", fill: o.hatColor }, P.head);
    el("path", { d: "M-8 -44 Q0 -46 8 -44 L10 -8 L-10 -8 Z", fill: shade(o.hatColor, 0.86) }, P.head);
    el("path", { d: "M-30 -22 Q-20 -36 -4 -40", fill: "none", stroke: "#fff", "stroke-width": 4, "stroke-linecap": "round", opacity: 0.35 }, P.head);
    el("path", { d: "M-42 -6 H50 Q56 -6 54 0 Q50 5 40 5 H-40 Q-45 3 -42 -6 Z", fill: shade(o.hatColor, 0.93) }, P.head);
  } else if (o.hat === "cap") {
    el("path", { d: "M-37 -2 A37 38 0 0 1 37 -2 Q0 8 -37 -2 Z", fill: o.hatColor }, P.head);
    el("path", { d: "M-30 -20 Q-10 -34 12 -30", fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round", opacity: 0.5 }, P.head);
  } else if (o.hat === "hair") {
    el("path", { d: "M-36 -3 A36 38 0 0 1 36 -10 Q30 -22 8 -26 Q-14 -26 -30 -8 Z", fill: "#15181a" }, P.head);
  }
  P.armFront = el("g", {}, P.body);
  const limb = (grp, c, Sx, Sy, Ex, Ey, w0, w1) => {          // verjüngtes Segment als Polygon
    const dx = Ex - Sx, dy = Ey - Sy, n = Math.hypot(dx, dy) || 1, px = -dy / n, py = dx / n;
    return `${Sx + px * w0},${Sy + py * w0} ${Ex + px * w1},${Ey + py * w1} ${Ex - px * w1},${Ey - py * w1} ${Sx - px * w0},${Sy - py * w0}`;
  };
  const mkArm = (grp, back) => {
    const A = { back };
    const c = back ? shade(o.coat, 0.8) : o.coat;
    A.up = el("polygon", { fill: c }, grp);
    A.lo = el("polygon", { fill: c }, grp);
    A.el = el("circle", { r: 12.5, fill: c }, grp);
    A.sh = el("circle", { r: 16, fill: c }, grp);
    A.cuff = o.stripes ? el("polygon", { fill: LIME }, grp) : null;
    A.hand = el("ellipse", { rx: 10.5, ry: 13, fill: back ? shade(o.skin, 0.92) : o.skin }, grp);
    A.thumb = el("ellipse", { rx: 4.5, ry: 8, fill: back ? shade(o.skin, 0.92) : o.skin }, grp);
    A.item = el("g", {}, grp);
    A.pose = { ...REST };
    A.limb = limb;
    return A;
  };
  P.arms = { front: mkArm(P.armFront, false), back: mkArm(P.armBack, true) };
  P.shoulder = { front: [40, -328], back: [-40, -328] };
  P.place = (x, y, sc = 1, dir = 1) => { P.x = x; P.y = y; P.sc = sc; P.dir = dir; P.g.setAttribute("transform", `translate(${x} ${y}) scale(${sc * dir} ${sc})`); };
  P.local = (wx, wy) => [(wx - P.x) / (P.sc * P.dir), (wy - P.y) / P.sc];
  P.ik = (which, target, world = false) => ikAngles(P.shoulder[which], world ? P.local(target[0], target[1]) : target);
  P.setArm = (which, pose) => {
    const A = P.arms[which], S = P.shoulder[which];
    const { E, H } = armPoints(S, pose.a, pose.b);
    A.pose = pose;
    A.up.setAttribute("points", limb(null, null, S[0], S[1], E[0], E[1], 15, 12));
    A.lo.setAttribute("points", limb(null, null, E[0], E[1], H[0], H[1], 12, 9));
    A.el.setAttribute("cx", E[0]); A.el.setAttribute("cy", E[1]);
    A.sh.setAttribute("cx", S[0]); A.sh.setAttribute("cy", S[1]);
    const g = pose.a + pose.b, ux = Math.sin(g), uy = Math.cos(g);
    if (A.cuff) A.cuff.setAttribute("points", limb(null, null, H[0] - ux * 26, H[1] - uy * 26, H[0] - ux * 15, H[1] - uy * 15, 10.6, 9.6));
    const hx = H[0] + ux * 7, hy = H[1] + uy * 7, deg = (-g * 180) / Math.PI;
    A.hand.setAttribute("cx", hx); A.hand.setAttribute("cy", hy); A.hand.setAttribute("transform", `rotate(${deg} ${hx} ${hy})`);
    A.thumb.setAttribute("cx", hx + 8); A.thumb.setAttribute("cy", hy - 4); A.thumb.setAttribute("transform", `rotate(${deg + 30} ${hx + 8} ${hy - 4})`);
    A.item.setAttribute("transform", `translate(${hx} ${hy})`);
    return [hx, hy];
  };
  P.armInFront = (on) => { if (on) P.body.appendChild(P.armBack); else P.body.insertBefore(P.armBack, P.torso); };
  P.walk = (phase, amount = 1) => {
    const a = 22 * amount;
    P.legs[0].setAttribute("transform", `translate(-14 -190) rotate(${Math.sin(phase) * a})`);
    P.legs[1].setAttribute("transform", `translate(14 -190) rotate(${-Math.sin(phase) * a})`);
    P.body.setAttribute("transform", `translate(0 ${-Math.abs(Math.sin(phase)) * 6 * amount}) rotate(${2.2 * amount} 0 -190)`);
  };
  P.swingPose = (which, phase, amount = 1) => {
    const s = Math.sin(phase) * (which === "front" ? -1 : 1);
    return { a: rad(-3) + s * rad(26) * amount, b: rad(7) + Math.max(0, s) * rad(30) * amount };
  };
  P.nod = (deg) => P.head.setAttribute("transform", `translate(0 -394) rotate(${deg})`);
  return P;
}

function vignette(g, id, strength = 0.55) {
  const d = el("defs", {}, g);
  const r = el("radialGradient", { id, cx: 0.5, cy: 0.48, r: 0.75 }, d);
  el("stop", { offset: 0.55, "stop-color": "#000", "stop-opacity": 0 }, r); el("stop", { offset: 1, "stop-color": "#000", "stop-opacity": strength }, r);
  el("rect", { width: 1280, height: 720, fill: `url(#${id})` }, g);
}
function metal(g, id, c1, c2) {
  const d = el("defs", {}, g);
  const l = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  el("stop", { offset: 0, "stop-color": c1 }, l); el("stop", { offset: 1, "stop-color": c2 }, l);
  return `url(#${id})`;
}

/* ----- Wischübergang (wie im Originalfilm: grüne Schräge mit Lime-Kante) ---- */
let wipeG;
function buildWipe() {
  wipeG = el("g", {});
  wipeG.green = el("polygon", { fill: FILMGREEN }, wipeG);
  wipeG.stripe = el("polygon", { fill: LIME }, wipeG);
}
function setWipe(p) { // null | 0..1 abdecken | 1..2 aufdecken
  if (p === null) { wipeG.setAttribute("display", "none"); return; }
  wipeG.removeAttribute("display");
  const SL = 216;
  if (p <= 1) {
    const xb = lerp(-270, 1290, ease(p));
    wipeG.green.setAttribute("points", `-5,-5 ${xb + SL},-5 ${xb},725 -5,725`);
    wipeG.stripe.setAttribute("points", `${xb + SL},-5 ${xb + SL + 46},-5 ${xb + 46},725 ${xb},725`);
  } else {
    const xb = lerp(-270, 1290, ease(p - 1));
    wipeG.green.setAttribute("points", `${xb + SL},-5 1290,-5 1290,725 ${xb},725`);
    wipeG.stripe.setAttribute("points", "0,0 0,0 0,0");
  }
}
const REVEAL = 0.5, COVER = 0.35;
function wipeFor(t, len) {
  if (t < REVEAL) return 1 + t / REVEAL;
  if (t > len - COVER) return clamp((t - (len - COVER)) / COVER);
  return null;
}

/* ======================= Szene: Stahlguss =================================
   Pfanne kippt, gießt in die Kokille auf dem Wagen; der Wagen fährt mit dem
   erstarrenden Block weiter, der nächste Wagen fährt ein. Der Strahl trifft
   immer die Schmelze in der Kokille.                                        */
function Stahl() {
  const S = {};
  S.g = el("g", {});
  const defs = el("defs", {}, S.g);
  const bg = el("linearGradient", { id: "sbg", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: 0, "stop-color": "#0d0908" }, bg); el("stop", { offset: 1, "stop-color": "#1a0f0a" }, bg);
  const gl = el("radialGradient", { id: "sglow" }, defs);
  el("stop", { offset: 0, "stop-color": "#ff7a1f", "stop-opacity": 0.55 }, gl); el("stop", { offset: 1, "stop-color": "#ff7a1f", "stop-opacity": 0 }, gl);
  const ld = el("linearGradient", { id: "sladle", x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
  el("stop", { offset: 0, "stop-color": "#3a4145" }, ld); el("stop", { offset: 0.5, "stop-color": "#59626a" }, ld); el("stop", { offset: 1, "stop-color": "#3a4145" }, ld);
  el("rect", { width: 1280, height: 720, fill: "url(#sbg)" }, S.g);
  for (let x = 20; x < 1280; x += 96) { el("rect", { x, y: 44, width: 8, height: 504, fill: "#1d1512" }, S.g); el("rect", { x: x + 8, y: 44, width: 2, height: 504, fill: "#2a1e18" }, S.g); }
  el("rect", { y: 22, width: 1280, height: 26, fill: "#241a17" }, S.g);
  S.glow = el("circle", { cx: 520, cy: 470, r: 420, fill: "url(#sglow)" }, S.g);
  // Kran mit Laufkatze
  el("rect", { x: 280, y: 30, width: 104, height: 20, rx: 4, fill: "#39424a" }, S.g);
  el("rect", { x: 300, y: 50, width: 64, height: 10, rx: 3, fill: "#2c3339" }, S.g);
  el("line", { x1: 332, y1: 60, x2: 330, y2: 120, stroke: "#59626a", "stroke-width": 7 }, S.g);
  for (let y2 = 70; y2 < 116; y2 += 12) el("line", { x1: 322, y1: y2, x2: 338, y2: y2 + 4, stroke: "#2c3339", "stroke-width": 3 }, S.g);
  // Förderstrecke
  el("rect", { y: 552, width: 1280, height: 30, fill: "#16110f" }, S.g);
  el("rect", { y: 582, width: 1280, height: 138, fill: "#0b0807" }, S.g);
  S.rollers = []; for (let i = 0; i < 27; i++) { const r = el("g", {}, S.g); el("circle", { r: 10, fill: "#2c2f31" }, r); el("line", { x1: -7, y1: -3, x2: 7, y2: 3, stroke: "#4b5257", "stroke-width": 3 }, r); S.rollers.push(r); }
  // Wagen mit Kokille
  S.carts = [];
  for (let j = 0; j < 4; j++) {
    const c = el("g", {}, S.g);
    el("rect", { x: -110, y: 482, width: 220, height: 70, rx: 6, fill: "#2b2f33", stroke: "#3d4348", "stroke-width": 3 }, c);
    el("rect", { x: -88, y: 470, width: 176, height: 24, fill: "#1a1d1f" }, c);
    c.melt = el("rect", { x: -84, width: 168, rx: 4 }, c);
    c.rim = el("rect", { x: -90, y: 466, width: 180, height: 6, rx: 3 }, c);
    c.glow = el("ellipse", { cx: 0, cy: 466, rx: 120, ry: 34, fill: "#ff8a2a", opacity: 0.0 }, c);
    S.carts.push(c);
  }
  // Pfanne
  S.ladle = el("g", {}, S.g);
  el("path", { d: "M-72 -20 L72 -20 L56 98 L-56 98 Z", fill: "url(#sladle)" }, S.ladle);
  el("rect", { x: -64, y: 20, width: 128, height: 6, fill: "#2d3337" }, S.ladle);
  el("rect", { x: -60, y: 62, width: 120, height: 6, fill: "#2d3337" }, S.ladle);
  for (const rx2 of [-50, -25, 0, 25, 50]) { el("circle", { cx: rx2, cy: 23, r: 2.2, fill: "#7b858c" }, S.ladle); el("circle", { cx: rx2 * 0.95, cy: 65, r: 2.2, fill: "#7b858c" }, S.ladle); }
  el("path", { d: "M-70 -20 Q-74 0 -60 96 L-52 96 Q-64 0 -60 -20 Z", fill: "#fff", opacity: 0.08 }, S.ladle);
  el("ellipse", { cx: 0, cy: -20, rx: 68, ry: 10, fill: "#ff9a3c" }, S.ladle);
  el("ellipse", { cx: -8, cy: -21, rx: 46, ry: 5, fill: "#ffd08a" }, S.ladle);
  el("path", { d: "M62 -21 l22 2 l-6 10 z", fill: "#4b5257" }, S.ladle);            // Ausguss
  el("circle", { cx: 0, cy: -14, r: 9, fill: "#2d3337" }, S.ladle); el("circle", { cx: 0, cy: -14, r: 3, fill: "#7b858c" }, S.ladle);
  // Strahl
  S.streamG = el("path", { fill: "none", stroke: "#ff7a1f", "stroke-linecap": "round", opacity: 0.55 }, S.g);
  S.stream = el("path", { fill: "none", stroke: "#ff9a3c", "stroke-linecap": "round" }, S.g);
  S.core = el("path", { fill: "none", stroke: "#ffe0a0", "stroke-linecap": "round" }, S.g);
  S.splash = []; for (let i = 0; i < 16; i++) S.splash.push(el("circle", { r: 3, fill: "#ffc36b" }, S.g));
  S.haze = []; for (let i = 0; i < 9; i++) S.haze.push(el("ellipse", { rx: 60, ry: 34, fill: "#a08468", opacity: 0 }, S.g));
  vignette(S.g, "stvig", 0.6);
  S.update = (s) => {
    const CYC = 3.6, X0 = 520, W = 600, PIV = [330, 120];
    const u = s + 1.0, n = Math.floor(u / CYC), p = u - CYC * n;
    const slide = ease(seg(p, 2.6, 3.6));
    const c = n + slide;
    // Kippwinkel
    let a = 0;
    if (p < 0.4) a = 50 * ease(p / 0.4); else if (p < 2.2) a = 50; else if (p < 2.6) a = 50 * (1 - ease((p - 2.2) / 0.4));
    S.ladle.setAttribute("transform", `translate(${PIV[0]} ${PIV[1]}) rotate(${a})`);
    // Rollen laufen mit den Wagen mit
    S.rollers.forEach((r, i) => { const x = (((i * 56 + c * W) % 1512) + 1512) % 1512 - 60; r.setAttribute("transform", `translate(${x} 567) rotate(${c * W * 1.2 % 360})`); });
    // Wagen
    let surfY = 540, curFill = 0;
    S.carts.forEach((cart, k) => {
      const j = n - 1 + k;                           // Wagen j: … , n−1 (fertig), n (Gießstelle), n+1 (kommt)
      const x = X0 + (c - j) * W;
      cart.setAttribute("transform", `translate(${x} 0)`);
      const f = j < n ? 1 : j === n ? clamp((p - 0.4) / 1.8) : 0;
      const h = 50 * f;
      cart.melt.setAttribute("y", 540 - h); cart.melt.setAttribute("height", h + 0.01);
      const heat = j < n ? clamp((x - X0) / 620) : 0;          // je weiter rechts, desto abgekühlt
      const col = (t) => `rgb(${Math.round(lerp(255, 150, t))},${Math.round(lerp(140, 40, t))},${Math.round(lerp(48, 24, t))})`;
      cart.melt.setAttribute("fill", col(heat)); cart.rim.setAttribute("fill", col(Math.min(1, heat + 0.1)));
      cart.glow.setAttribute("opacity", (0.25 * (1 - heat)) * (f > 0 ? 1 : 0));
      if (j === n) { surfY = 540 - h; curFill = f; }

    const strike = k >= 0.68 ? (k - 0.68) * P : (k < 0.58 ? (k + 1 - 0.68) * P : 0);

    S.piece.setAttribute("fill", `rgb(255,${Math.round(110 + 90 * flash)},${Math.round(30 + 60 * flash)})`);
    S.glow1.setAttribute("opacity", 0.55 + 0.45 * flash);
    const r = rng(7);
    S.sparks.forEach((s, i) => {

      }
    });
    // Zweiter Handwerker: hält das Werkstück mit beiden Händen an die Scheibe
    S.pB.place(898, 700, 0.86, 1); S.pB.nod(4 + Math.sin(t * 2) * 1.5);
    S.pB.legs.forEach((l, i) => l.setAttribute("transform", `translate(${i ? 14 : -14} -190)`));
    const tr = Math.sin(t * 9) * 2;
    S.pB.setArm("front", S.pB.ik("front", [952, 532 + tr], true));
    S.pB.setArm("back", S.pB.ik("back", [934, 542 + tr], true));
    S.workB.setAttribute("transform", "rotate(2)");
    S.pB.armInFront(false);
    S.wheel.setAttribute("transform", `translate(1040 520) rotate(${t * 720})`);
    S.glow2.setAttribute("opacity", 0.5 + 0.3 * Math.sin(t * 7));
    S.lamp.setAttribute("transform", `translate(600 0) rotate(${Math.sin(t * 0.9) * 2.2})`);
  };
  return S;
}

  const T = { walk0: 0.5, meet: 2.0, shakeA: 2.2, shakeB: 4.3, apart: 4.7, apartEnd: 6.0, scan0: 6.2, scan1: 8.9, cards0: 8.4, check: 10.9 };
  S.update = (t) => {
    const yG = 618, sc = 0.93;

    const wRest = S.w.swingPose("front", phase, wa);

    const pointing = seg(t, T.scan0 - 0.3, T.scan0 + 0.3) * (1 - seg(t, T.scan1 + 0.2, T.scan1 + 0.6));

    });
