<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b09" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  {{robots}}<link rel="canonical" href="{{canonical}}" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Werringloer Komponentenmanagement" />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:title" content="{{og_title}}" />
  <meta property="og:description" content="{{og_description}}" />
  <meta property="og:url" content="{{canonical}}" />
  <meta property="og:image" content="https://werringloer.de/assets/og-image.jpg?v=3" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{og_title}}" />
  <meta name="twitter:description" content="{{og_description}}" />
  <meta name="twitter:image" content="https://werringloer.de/assets/og-image.jpg?v=3" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preload" href="assets/fonts/archivo-wdth.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/inter-wght.woff2" as="font" type="font/woff2" crossorigin />
  <script>(function(d){d.classList.add("js");d.setAttribute("data-theme","dark");try{var t=localStorage.getItem("theme");if(t==="light")d.setAttribute("data-theme","light")}catch(e){}})(document.documentElement);</script>
  <link rel="stylesheet" href="css/style.css?v={{version}}" />
