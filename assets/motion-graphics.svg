<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .mg-line { fill: none; stroke: #d4ec5f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .mg-circle { fill: #d4ec5f; }
      .mg-rect { fill: #2f8a52; stroke: #d4ec5f; stroke-width: 1.5; }
      .mg-text { font-family: "Inter", sans-serif; font-size: 14px; fill: #f1f4f1; }
      .mg-pulse { animation: pulse-mg 2s ease-in-out infinite; }
      .mg-float { animation: float-mg 3s ease-in-out infinite; }
      .mg-draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw-mg 4s ease-out forwards; }
      @keyframes pulse-mg {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes float-mg {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      @keyframes draw-mg {
        to { stroke-dashoffset: 0; }
      }
      @keyframes rotate-mg {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .mg-rotate { animation: rotate-mg 8s linear infinite; }
    </style>

    <!-- Gradient-Definitionen -->
    <linearGradient id="grad-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4ec5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#afd844;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2f8a52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c3a24;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="grad-radial">
      <stop offset="0%" style="stop-color:#d4ec5f;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d4ec5f;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="1200" height="800" fill="#0f1211" opacity="0.95" />

  <!-- Section 1: Data Flow Visualization -->
  <g id="section-flow" transform="translate(0, 0)">
    <text x="60" y="40" class="mg-text" font-size="18" font-weight="600">Datenflusss</text>

    <!-- Input nodes -->
    <g class="mg-float" style="animation-delay: 0s;">
      <circle cx="80" cy="120" r="20" fill="url(#grad-green)" />
      <text x="80" y="125" text-anchor="middle" class="mg-text" font-size="12">ERP</text>
    </g>

    <g class="mg-float" style="animation-delay: 0.4s;">
      <circle cx="180" cy="120" r="20" fill="url(#grad-green)" />
      <text x="180" y="125" text-anchor="middle" class="mg-text" font-size="12">MES</text>
    </g>

    <g class="mg-float" style="animation-delay: 0.8s;">
      <circle cx="280" cy="120" r="20" fill="url(#grad-green)" />
      <text x="280" y="125" text-anchor="middle" class="mg-text" font-size="12">PLC</text>
    </g>

    <!-- Flow arrows -->
    <g class="mg-draw" style="animation-delay: 0.5s;">
      <path class="mg-line" d="M 100 140 Q 150 180 200 180" />
      <path class="mg-line" d="M 200 140 Q 240 180 280 180" />
      <path class="mg-line" d="M 300 140 Q 320 180 340 180" />
    </g>

    <!-- Central processing node -->
    <g class="mg-rotate" style="animation-duration: 12s;">
      <circle cx="320" cy="200" r="35" fill="none" stroke="url(#grad-lime)" stroke-width="2" opacity="0.6" />
      <circle cx="320" cy="200" r="25" fill="url(#grad-lime)" opacity="0.4" />
      <circle cx="320" cy="200" r="15" class="mg-pulse" fill="url(#grad-lime)" />
    </g>

    <text x="320" y="260" text-anchor="middle" class="mg-text" font-size="11" font-weight="600">Smart</text>
    <text x="320" y="275" text-anchor="middle" class="mg-text" font-size="11" font-weight="600">Parts</text>

    <!-- Output flows -->
    <g class="mg-draw" style="animation-delay: 1s;">
      <path class="mg-line" d="M 320 235 L 320 320" />
      <path class="mg-line" d="M 280 230 L 160 320" />
      <path class="mg-line" d="M 360 230 L 480 320" />
    </g>

    <!-- Output nodes -->
    <g class="mg-float" style="animation-delay: 1.2s;">
      <rect x="130" y="320" width="60" height="50" rx="6" fill="url(#grad-lime)" />
      <text x="160" y="345" text-anchor="middle" class="mg-text" font-size="11" fill="#0e1411">Dashboard</text>
    </g>

    <g class="mg-float" style="animation-delay: 1.6s;">
      <rect x="280" y="320" width="80" height="50" rx="6" fill="url(#grad-lime)" />
      <text x="320" y="345" text-anchor="middle" class="mg-text" font-size="11" fill="#0e1411">Reports</text>
    </g>

    <g class="mg-float" style="animation-delay: 2s;">
      <rect x="420" y="320" width="60" height="50" rx="6" fill="url(#grad-lime)" />
      <text x="450" y="345" text-anchor="middle" class="mg-text" font-size="11" fill="#0e1411">Alerts</text>
    </g>
  </g>

  <!-- Section 2: Process Optimization -->
  <g id="section-optimize" transform="translate(600, 0)">
    <text x="60" y="40" class="mg-text" font-size="18" font-weight="600">Prozessoptimierung</text>

    <!-- Before state -->
    <g>
      <text x="60" y="90" class="mg-text" font-size="12" font-weight="500">Vorher</text>
      <circle cx="100" cy="140" r="25" fill="none" stroke="#e0a526" stroke-width="2" opacity="0.6" />
      <text x="100" y="150" text-anchor="middle" class="mg-text" font-size="24" fill="#e0a526">!</text>

      <rect x="60" y="200" width="80" height="40" rx="4" fill="#d64545" opacity="0.3" />
      <text x="100" y="225" text-anchor="middle" class="mg-text" font-size="10">Ineffizienzen</text>
    </g>

    <!-- Arrow -->
    <g class="mg-draw">
      <path class="mg-line" d="M 160 140 L 220 140" />
      <path class="mg-line" d="M 215 135 L 225 140 L 215 145" />
    </g>

    <!-- After state -->
    <g class="mg-float" style="animation-delay: 1s;">
      <text x="280" y="90" class="mg-text" font-size="12" font-weight="500">Nachher</text>
      <circle cx="320" cy="140" r="25" fill="#2f9a5a" opacity="0.6" />
      <text x="320" y="150" text-anchor="middle" class="mg-text" font-size="24" fill="#2f9a5a">✓</text>

      <rect x="280" y="200" width="80" height="40" rx="4" fill="#2f9a5a" opacity="0.3" />
      <text x="320" y="225" text-anchor="middle" class="mg-text" font-size="10">Optimiert</text>
    </g>

    <!-- Savings indicator -->
    <g class="mg-float" style="animation-delay: 1.5s;">
      <circle cx="320" cy="300" r="30" fill="url(#grad-lime)" />
      <text x="320" y="295" text-anchor="middle" class="mg-text" font-size="12" font-weight="700" fill="#0e1411">25%</text>
      <text x="320" y="310" text-anchor="middle" class="mg-text" font-size="10" fill="#0e1411">Einsparung</text>
    </g>
  </g>

  <!-- Section 3: Timeline/Progress -->
  <g id="section-timeline" transform="translate(0, 450)">
    <text x="60" y="40" class="mg-text" font-size="18" font-weight="600">Implementierungsplan</text>

    <!-- Timeline line -->
    <line x1="80" y1="140" x2="520" y2="140" stroke="url(#grad-lime)" stroke-width="3" opacity="0.5" />

    <!-- Timeline points -->
    <g>
      <!-- Point 1: Analyse -->
      <g class="mg-float" style="animation-delay: 0s;">
        <circle cx="100" cy="140" r="12" class="mg-pulse" fill="url(#grad-lime)" />
      </g>
      <text x="100" y="165" text-anchor="middle" class="mg-text" font-size="11" font-weight="600">Analyse</text>
      <text x="100" y="180" text-anchor="middle" class="mg-text" font-size="9">Tag 1-3</text>

      <!-- Point 2: Design -->
      <g class="mg-float" style="animation-delay: 0.5s;">
        <circle cx="240" cy="140" r="12" class="mg-pulse" fill="url(#grad-lime)" opacity="0.7" />
      </g>
      <text x="240" y="165" text-anchor="middle" class="mg-text" font-size="11" font-weight="600">Design</text>
      <text x="240" y="180" text-anchor="middle" class="mg-text" font-size="9">Tag 4-7</text>

      <!-- Point 3: Implementierung -->
      <g class="mg-float" style="animation-delay: 1s;">
        <circle cx="380" cy="140" r="12" class="mg-pulse" fill="url(#grad-lime)" opacity="0.5" />
      </g>
      <text x="380" y="165" text-anchor="middle" class="mg-text" font-size="11" font-weight="600">Implementierung</text>
      <text x="380" y="180" text-anchor="middle" class="mg-text" font-size="9">Tag 8-14</text>

      <!-- Point 4: Live -->
      <g class="mg-float" style="animation-delay: 1.5s;">
        <circle cx="520" cy="140" r="12" class="mg-pulse" fill="url(#grad-lime)" opacity="0.3" />
      </g>
      <text x="520" y="165" text-anchor="middle" class="mg-text" font-size="11" font-weight="600">Go-Live</text>
      <text x="520" y="180" text-anchor="middle" class="mg-text" font-size="9">Tag 15</text>
    </g>

    <!-- Progress bar -->
    <rect x="80" y="250" width="440" height="8" rx="4" fill="#0e1411" opacity="0.3" />
    <rect x="80" y="250" width="220" height="8" rx="4" fill="url(#grad-lime)" class="mg-draw" style="animation-delay: 2s;" />
    <text x="320" y="280" text-anchor="middle" class="mg-text" font-size="12" font-weight="600">50% Abschluss</text>
  </g>

  <!-- Section 4: Key Metrics -->
  <g id="section-metrics" transform="translate(600, 450)">
    <text x="60" y="40" class="mg-text" font-size="18" font-weight="600">KPI-Übersicht</text>

    <!-- Metric 1: Durchlaufzeit -->
    <g class="mg-float" style="animation-delay: 0.5s;">
      <rect x="60" y="100" width="100" height="120" rx="8" fill="none" stroke="url(#grad-lime)" stroke-width="2" opacity="0.6" />
      <circle cx="110" cy="130" r="18" class="mg-pulse" fill="url(#grad-lime)" />
      <text x="110" y="140" text-anchor="middle" class="mg-text" font-size="16" font-weight="700" fill="#d4ec5f">-42%</text>
      <text x="110" y="175" text-anchor="middle" class="mg-text" font-size="10">Durchlaufzeit</text>
    </g>

    <!-- Metric 2: Kosten -->
    <g class="mg-float" style="animation-delay: 1s;">
      <rect x="200" y="100" width="100" height="120" rx="8" fill="none" stroke="url(#grad-lime)" stroke-width="2" opacity="0.6" />
      <circle cx="250" cy="130" r="18" class="mg-pulse" fill="url(#grad-lime)" />
      <text x="250" y="140" text-anchor="middle" class="mg-text" font-size="16" font-weight="700" fill="#d4ec5f">-28%</text>
      <text x="250" y="175" text-anchor="middle" class="mg-text" font-size="10">Lagerkosten</text>
    </g>

    <!-- Metric 3: Verfügbarkeit -->
    <g class="mg-float" style="animation-delay: 1.5s;">
      <rect x="340" y="100" width="100" height="120" rx="8" fill="none" stroke="url(#grad-lime)" stroke-width="2" opacity="0.6" />
      <circle cx="390" cy="130" r="18" class="mg-pulse" fill="url(#grad-lime)" />
      <text x="390" y="140" text-anchor="middle" class="mg-text" font-size="16" font-weight="700" fill="#d4ec5f">+35%</text>
      <text x="390" y="175" text-anchor="middle" class="mg-text" font-size="10">Verfügbarkeit</text>
    </g>

    <!-- Chart -->
    <g class="mg-draw" style="animation-delay: 2s;">
      <!-- Y-axis -->
      <line x1="80" y1="280" x2="80" y2="380" stroke="url(#grad-lime)" stroke-width="1.5" opacity="0.5" />
      <!-- X-axis -->
      <line x1="80" y1="380" x2="400" y2="380" stroke="url(#grad-lime)" stroke-width="1.5" opacity="0.5" />

      <!-- Bars -->
      <rect x="100" y="340" width="40" height="40" fill="url(#grad-lime)" opacity="0.6" />
      <rect x="160" y="310" width="40" height="70" fill="url(#grad-lime)" opacity="0.7" />
      <rect x="220" y="280" width="40" height="100" fill="url(#grad-lime)" opacity="0.8" />
      <rect x="280" y="240" width="40" height="140" fill="url(#grad-lime)" opacity="0.9" />
      <rect x="340" y="200" width="40" height="180" fill="url(#grad-lime)" opacity="1" />
    </g>
  </g>

  <!-- Floating particles (background effect) -->
  <g id="particles" opacity="0.15">
    <circle cx="200" cy="100" r="3" fill="#d4ec5f" class="mg-float" style="animation-delay: 0s; animation-duration: 5s;" />
    <circle cx="900" cy="150" r="2.5" fill="#d4ec5f" class="mg-float" style="animation-delay: 1s; animation-duration: 6s;" />
    <circle cx="150" cy="600" r="3.5" fill="#d4ec5f" class="mg-float" style="animation-delay: 2s; animation-duration: 7s;" />
    <circle cx="1050" cy="500" r="2" fill="#d4ec5f" class="mg-float" style="animation-delay: 1.5s; animation-duration: 8s;" />
    <circle cx="600" cy="650" r="2.5" fill="#d4ec5f" class="mg-float" style="animation-delay: 0.5s; animation-duration: 5.5s;" />
  </g>
</svg>